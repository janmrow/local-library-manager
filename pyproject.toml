[project]
name = "local-library-manager"
version = "0.1.0"
description = "Local Library Manager for one library branch"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.1",
    "drf-spectacular>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "catalog", "circulation", "accounts"]
