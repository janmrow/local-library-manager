# Local PostgreSQL for development and browser tests.
# Values come from `.env` (copy `.env.example` first); fallbacks match it.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library}
      POSTGRES_DB: ${DB_NAME:-library}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-library}"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
