{% load static %}
<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Biblioteka{% endblock %} — Biblioteka</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/">Biblioteka</a>
        <nav class="site-nav" aria-label="Nawigacja">
          <a href="/">Katalog</a>
          <a href="/konto/">Konto</a>
          <a href="/wypozyczenia/">Moje wypożyczenia</a>
          <a href="/panel/">Panel bibliotekarza</a>
        </nav>
        <p class="session" id="session-state" role="status">Gość</p>
      </div>
    </header>
    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <small>Lokalna biblioteka — katalog i wypożyczenia na miejscu.</small>
      </div>
    </footer>
    <script type="module">
      import { fetchSession } from "{% static 'js/api.js' %}";
      const node = document.getElementById("session-state");
      (async () => {
        try {
          const state = await fetchSession();
          node.textContent = state.authenticated
            ? `${state.username}${state.is_librarian ? " (bibliotekarz)" : ""}`
            : "Gość";
        } catch {
          node.textContent = "Gość";
        }
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
